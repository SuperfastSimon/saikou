name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Engine imports with zero dependencies
        run: python -c "import sys; sys.path.insert(0, '.'); import saikou; print(saikou.__version__)"
      - run: python -m pip install -e ".[dev]"
      - run: saikou selftest
      - run: python -m pytest -q

  dogfood:
    # Saikou checks its own pull requests. tests/ is excluded because its
    # fixtures are deliberate fake fixes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read   # required for a SARIF upload from a private repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        with:
          paths: "saikou scripts action.yml"
          # Code scanning takes uploads on public repositories, and on private ones only with
          # GitHub Code Security or GitHub Advanced Security; while this one is private the job
          # summary carries the findings.
          upload-sarif: ${{ !github.event.repository.private }}
