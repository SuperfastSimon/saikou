name: release

# Publishes to PyPI when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0).
# Uses PyPI trusted publishing: no API token is stored anywhere. It needs a one-time trusted
# publisher entry for this repository and workflow on pypi.org.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build "pytest>=8" bandit fastapi pydantic httpx
      - run: python -m pip install -e . && saikou selftest && python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
