name: "Saikou verify"
description: "Block pull requests that fake security fixes: new security-analyser suppressions, unwired guards, partial shared-sink fixes, AI elision, weakened analyser config."
author: "The Saikou authors"
branding:
  icon: "shield"
  color: "green"

inputs:
  base:
    description: "Base ref or SHA. Default: the pull request base, or the previous commit on push."
    required: false
    default: ""
  claimed-threats:
    description: "Threat classes this change claims to fix (e.g. injection,crypto). A surviving sink of a claimed class blocks."
    required: false
    default: ""
  strict-api:
    description: "Block removed or incompatibly changed public Python API."
    required: false
    default: "false"
  paths:
    description: "Space-separated paths to limit the check to (default: whole repository)."
    required: false
    default: ""
  warn-only:
    description: "Comma-separated check ids reported as warnings instead of hard fails, for every file. To leave one file out (a vendored bundle over 1 MB that blocks with content_not_checked), use paths with a pathspec instead, e.g. \". :(exclude)vendor/bundle.js\"."
    required: false
    default: ""
  only-agent-prs:
    description: "Run only when the pull request author is a bot or listed in agent-authors."
    required: false
    default: "false"
  agent-authors:
    description: "Comma-separated GitHub logins treated as AI agents (in addition to any bot account)."
    required: false
    default: "Copilot,copilot-swe-agent,devin-ai-integration,codex,claude"
  analyser:
    description: "Also run bandit twice (normal and --ignore-nosec) on changed Python files."
    required: false
    default: "false"
  upload-sarif:
    description: "Upload findings to GitHub code scanning. Needs code scanning on the repository (every public one; a private one only with GitHub Code Security or GitHub Advanced Security) and permissions security-events: write, plus actions: read in a private repository. Set to false otherwise; the job summary still lists every finding."
    required: false
    default: "true"
  fail-on-findings:
    description: "Fail the job when a hard fail is found."
    required: false
    default: "true"
  from-sarif:
    description: "Optional SARIF 2.1.0 file to derive per-file claimed threats from."
    required: false
    default: ""
  policy:
    description: "Optional .saikou.toml policy file (must-preserve rules, time-bounded waivers). Read from the base commit, so a pull request cannot loosen its own gate."
    required: false
    default: ""
  evidence-file:
    description: "Optional path to write a deterministic Evidence Bundle JSON."
    required: false
    default: ""
  comment-pr:
    description: "Post or update a sticky pull-request comment with findings (requires pull-requests: write)."
    required: false
    default: "false"

outputs:
  blocked:
    description: "'true' when at least one hard fail was found."
    value: ${{ steps.run.outputs.blocked }}
  skipped:
    description: "'true' when the check did not run (not an agent PR in only-agent-prs mode)."
    value: ${{ steps.gate.outputs.skipped }}

runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      env:
        ONLY_AGENT: ${{ inputs.only-agent-prs }}
        AGENTS: ${{ inputs.agent-authors }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
      run: |
        skipped=false
        if [ "$ONLY_AGENT" = "true" ]; then
          skipped=true
          if [ "$AUTHOR_TYPE" = "Bot" ] || [[ "$AUTHOR" == *"[bot]" ]]; then skipped=false; fi
          IFS=',' read -ra list <<< "$AGENTS"
          for a in "${list[@]}"; do
            if [ "$(echo "$a" | xargs)" = "$AUTHOR" ]; then skipped=false; fi
          done
          if [ "$skipped" = "true" ]; then echo "Saikou: PR by '$AUTHOR' is not an agent PR; skipping."; fi
        fi
        echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

    - if: steps.gate.outputs.skipped != 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"

    # The working directory is the checked-out repository, which may hold its own saikou/,
    # pip/ or sitecustomize.py (a pull request can add one). python -I (isolated mode) keeps
    # the current folder, PYTHONPATH and the user site off the import path, and PYTHONPATH is
    # unset for the tools started from here (bandit), so only the installed packages run.
    - if: steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ANALYSER: ${{ inputs.analyser }}
      run: |
        unset PYTHONPATH
        python -I -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"
        if [ "$ANALYSER" = "true" ]; then python -I -m pip install --disable-pip-version-check --quiet "bandit>=1.7.3"; fi
        python -I -m saikou --version
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --quiet --unshallow origin || true
        fi

    - id: run
      if: steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CLAIMS: ${{ inputs.claimed-threats }}
        STRICT_API: ${{ inputs.strict-api }}
        PATHS: ${{ inputs.paths }}
        WARN_ONLY: ${{ inputs.warn-only }}
        ANALYSER: ${{ inputs.analyser }}
        FROM_SARIF: ${{ inputs.from-sarif }}
        POLICY: ${{ inputs.policy }}
        EVIDENCE_FILE: ${{ inputs.evidence-file }}
        COMMENT_PR: ${{ inputs.comment-pr }}
      run: |
        unset PYTHONPATH
        base="${INPUT_BASE:-${PR_BASE:-$PUSH_BEFORE}}"
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          # First push of a branch: there is no "before". Check every commit the branch adds
          # to the default branch; HEAD~1 alone let a fake fix in an earlier commit through.
          base=""
          if [ -n "$DEFAULT_BRANCH" ] && git rev-parse -q --verify "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            base="$(git merge-base HEAD "refs/remotes/origin/$DEFAULT_BRANCH" || true)"
          fi
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base="$(git rev-parse HEAD~1)"
            echo "::warning::saikou: no base for this push (new branch, default branch not fetched); only the last commit is checked. Use fetch-depth: 0 or set the base input."
          fi
        fi
        args=(diff --base "$base" --head HEAD --sarif-file saikou.sarif --summary "$GITHUB_STEP_SUMMARY")
        if [ -n "$CLAIMS" ]; then args+=(--claimed-threats "$CLAIMS"); fi
        if [ "$STRICT_API" = "true" ]; then args+=(--strict-api); fi
        if [ -n "$WARN_ONLY" ]; then args+=(--warn-only "$WARN_ONLY"); fi
        if [ "$ANALYSER" = "true" ]; then args+=(--analyser); fi
        if [ -n "$FROM_SARIF" ]; then args+=(--from-sarif "$FROM_SARIF"); fi
        if [ -n "$POLICY" ]; then args+=(--policy "$POLICY"); fi
        if [ -n "$EVIDENCE_FILE" ]; then args+=(--evidence-file "$EVIDENCE_FILE"); fi
        if [ "$COMMENT_PR" = "true" ]; then args+=(--pr-comment-file saikou-pr-comment.md); fi
        if [ -n "$PATHS" ]; then read -ra extra <<< "$PATHS"; args+=(-- "${extra[@]}"); fi
        set +e
        python -I -m saikou "${args[@]}"
        code=$?
        set -e
        if [ "$code" -ge 2 ]; then echo "::error::saikou failed to run (exit $code)"; exit "$code"; fi
        if [ "$code" -eq 1 ]; then echo "blocked=true" >> "$GITHUB_OUTPUT"; else echo "blocked=false" >> "$GITHUB_OUTPUT"; fi

    - if: steps.gate.outputs.skipped != 'true' && inputs.upload-sarif == 'true' && steps.run.outcome == 'success'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
      with:
        sarif_file: saikou.sarif
        category: saikou

    - if: steps.gate.outputs.skipped != 'true' && inputs.comment-pr == 'true' && steps.run.outcome == 'success' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        # One sticky comment per pull request: update ours (found by its marker) or create it.
        # Never fails the job: a fork's read-only token or a runner without gh only warns.
        marker='<!-- saikou-verify-comment -->'
        if ! command -v gh >/dev/null; then echo "::warning::saikou: gh is not installed, PR comment skipped"; exit 0; fi
        id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)" || id=""
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@saikou-pr-comment.md >/dev/null \
            || echo "::warning::saikou: could not update the PR comment (needs pull-requests: write)"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@saikou-pr-comment.md >/dev/null \
            || echo "::warning::saikou: could not post the PR comment (needs pull-requests: write)"
        fi

    - if: steps.gate.outputs.skipped != 'true' && inputs.fail-on-findings == 'true' && steps.run.outputs.blocked == 'true'
      shell: bash
      run: |
        echo "::error::Saikou blocked this change: see the job summary for each finding and how it was established."
        exit 1
